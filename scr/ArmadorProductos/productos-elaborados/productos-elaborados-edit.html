<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto elaborado – Armador de Productos</title>
    <link rel="stylesheet" href="../armador-layout.css">
    <link rel="stylesheet" href="productos-elaborados.css">
</head>
<body class="armador-page">
    <header class="armador-page-header">
        <a href="productos-elaborados.html" class="armador-page-back">← Productos elaborados</a>
        <h1 class="armador-page-title">Editar producto elaborado</h1>
    </header>
    <main class="armador-page-main">
        <div id="armador-msg" class="armador-msg" style="display: none;"></div>
        <div id="armador-loading" class="armador-loading">Cargando…</div>
        <form id="form-pe" class="armador-form" style="display: none;">
            <div class="armador-form-group">
                <label>ID producto</label>
                <input type="text" id="IDProducto" name="IDProducto" readonly disabled>
            </div>
            <div class="armador-form-group">
                <label for="Comercio-Sucursal">Comercio sucursal</label>
                <select id="Comercio-Sucursal" name="Comercio-Sucursal"></select>
            </div>
            <div class="armador-form-group">
                <label for="Nombre-Producto">Nombre producto</label>
                <input type="text" id="Nombre-Producto" name="Nombre-Producto">
            </div>
            <div class="armador-form-group">
                <label for="Costo-Producto-Final-Actual">Costo producto final actual</label>
                <input type="number" id="Costo-Producto-Final-Actual" name="Costo-Producto-Final-Actual" step="0.01">
            </div>
            <div class="armador-form-group">
                <label for="Habilitado">Habilitado</label>
                <select id="Habilitado" name="Habilitado">
                    <option value="">—</option>
                    <option value="SI">Sí</option>
                    <option value="NO">No</option>
                </select>
            </div>
            <div class="armador-form-group">
                <label for="Observaciones">Observaciones</label>
                <textarea id="Observaciones" name="Observaciones" rows="2"></textarea>
            </div>
            <div class="armador-form-actions">
                <button type="submit" class="armador-btn armador-btn-primary">Guardar</button>
                <a href="productos-elaborados.html" class="armador-btn armador-btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
    <script src="../../Configuracion/config.js"></script>
    <script src="../armador-api.js"></script>
    <script src="productos-elaborados-edit.js"></script>
</body>
</html>
